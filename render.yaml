# Render Blueprint: link this GitHub repo as a Blueprint.
# Free web storage is ephemeral. Use an external durable database for traveler data
# and confirm persistence across a redeploy before enabling public registration.
services:
  - type: web
    name: masr-guide-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    envVars:
      - key: APP_ENV
        value: portfolio
      - key: PORT
        value: '10000'
      - key: PARTNER_INQUIRIES_ENABLED
        value: 'false'
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: '15'
      - key: NEON_DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Off by default to avoid unexpected costs. Enable after reviewing usage/terms.
      - key: GEMINI_SEARCH_GROUNDING
        value: 'false'
      - key: AI_PROVIDER
        value: gemini
      # Only configure OpenAI if its paid API is enabled for this project.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ADMIN_API_TOKEN
        sync: false
