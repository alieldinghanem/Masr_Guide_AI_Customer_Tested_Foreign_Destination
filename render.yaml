# Render Blueprint: link this GitHub repo as a Blueprint.
# Free plan is intended for a PUBLIC PORTFOLIO PREVIEW only; its filesystem is ephemeral.
# For durable user accounts, upgrade to persistent disk/managed database BEFORE public data use.
services:
  - type: web
    name: masr-guide-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    envVars:
      - key: APP_ENV
        value: portfolio
      - key: PORT
        value: '10000'
      - key: PARTNER_INQUIRIES_ENABLED
        value: 'false'
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: '15'
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Off by default to avoid unexpected costs. Enable after reviewing usage/terms.
      - key: GEMINI_SEARCH_GROUNDING
        value: 'false'
      - key: AI_PROVIDER
        value: gemini
      # Only configure OpenAI if its paid API is enabled for this project.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ADMIN_API_TOKEN
        sync: false
