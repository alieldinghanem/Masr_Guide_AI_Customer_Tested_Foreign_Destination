limit_req_zone $binary_remote_addr zone=chat_per_ip:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=account_per_ip:10m rate=15r/m;
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 512k;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Scripts and styles only from this origin (+ Google Fonts CSS). The app has no inline <style>/<script>;
    # React sets its one dynamic style through the CSSOM, which CSP allows. The only third-party
    # embeds are OpenStreetMap map frames; curated editorial photos load from Unsplash CDN.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://*.openstreetmap.org; frame-src https://www.openstreetmap.org; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    limit_req_status 429;
    # Per-client edge throttle for paid-LLM traffic; complements backend demo guard.
    location = /api/chat {
        limit_req zone=chat_per_ip burst=6 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /api/consult {
        limit_req zone=chat_per_ip burst=6 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /api/auth/login {
        limit_req zone=account_per_ip burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/auth/register {
        limit_req zone=account_per_ip burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /assets/ {
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
