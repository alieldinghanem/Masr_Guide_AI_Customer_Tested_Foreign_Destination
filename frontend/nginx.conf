limit_req_zone $binary_remote_addr zone=chat_per_ip:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=account_per_ip:10m rate=15r/m;
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 512k;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Google Identity Services uses a Google-hosted script, iframe, CSS and connection.
    # Keep other third-party scripts disabled. Google client IDs are public; never expose secrets.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://commons.wikimedia.org https://upload.wikimedia.org https://*.openstreetmap.org; frame-src https://www.openstreetmap.org https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    limit_req_status 429;
    # Per-client edge throttle for paid-LLM traffic; complements backend demo guard.
    location = /api/chat {
        limit_req zone=chat_per_ip burst=6 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /api/consult {
        limit_req zone=chat_per_ip burst=6 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /api/auth/login {
        limit_req zone=account_per_ip burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/auth/google {
        limit_req zone=account_per_ip burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/auth/google/link {
        limit_req zone=account_per_ip burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/auth/register {
        limit_req zone=account_per_ip burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /assets/ {
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
