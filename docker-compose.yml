services:
  backend:
    build: ./backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Nginx sets X-Real-IP; trusting it gives each real client its own backend budget.
      # Only enable behind a proxy you control: direct access to port 8000 could spoof the header.
      TRUST_PROXY_HEADERS: "1"
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-20}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - guide_data:/app/data
  frontend:
    build: ./frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  guide_data:
