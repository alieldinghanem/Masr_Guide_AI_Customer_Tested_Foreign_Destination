name: Masr Guide AI - CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Release source secret gate
        run: python scripts/check_no_secrets_v75.py
      - name: Validate both local launcher contracts
        run: python scripts/qa_local_launchers.py
      - name: Validate deployment CSP against photo and map assets
        run: python scripts/qa_frontend_security_contract.py
      - name: Test backend
        working-directory: backend
        run: python -m pytest -q
      - name: Independent offline tourist conversation QA (legacy audit + 52 corrected release gate)
        run: |
          python qa_chatbot/blackbox_probe.py
          python qa_chatbot/legacy_acceptance_v7.py
          python qa_chatbot/acceptance_evaluation.py
      - name: Independently exercise new customer phrasing through real HTTP
        run: python scripts/qa_customer_phrases_live_http_20261031.py
      - name: Planner invariants stress (1500 scenarios)
        run: python scripts/qa_planner_stress.py
      - name: Validate Python syntax
        run: python -m compileall -q backend/app
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependency-free traveler data contract regression
        working-directory: frontend
        run: node --test scripts/validate_trip_contract.test.mjs scripts/chat_ui_modes.test.mjs scripts/chat_openai_modes.test.mjs scripts/category_selection.test.mjs scripts/payment_safety.test.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Validate frontend lint
        working-directory: frontend
        run: npm run lint

  browser:
    name: Compiled React + backend browser E2E
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application and browser dependencies
        run: |
          pip install -r backend/requirements-dev.txt playwright
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend --no-audit --no-fund
      - name: Build real React release
        run: npm run build --prefix frontend
      - name: Start integrated production-style FastAPI server
        run: |
          cd backend
          GEMINI_API_KEY= OPENAI_API_KEY= DATABASE_PATH=${{ runner.temp }}/masr_catalog.sqlite3 MASR_USER_DB=${{ runner.temp }}/masr_accounts.sqlite3 python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/masr_browser_server.log 2>&1 &
          echo $! > /tmp/masr_browser_server.pid
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8000/api/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/masr_browser_server.log
          exit 1
      - name: Execute real Chromium desktop/mobile E2E
        env:
          FRONTEND_URL: http://127.0.0.1:8000
        run: python scripts/qa_browser_e2e.py
      - name: Show server error log on failure
        if: failure()
        run: cat /tmp/masr_browser_server.log || true
