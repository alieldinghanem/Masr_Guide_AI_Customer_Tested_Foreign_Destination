services:
  masr-guide:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:8000:10000'
    environment:
      PORT: '10000'
      APP_ENV: production
      # Set YES only after confirming a persistent disk, recovery and backup tests.
      MASR_DURABLE_STORAGE_CONFIRMED: ${MASR_DURABLE_STORAGE_CONFIRMED:-false}
      BACKUP_RECOVERY_VERIFIED: ${BACKUP_RECOVERY_VERIFIED:-false}
      MASR_USER_DB: /app/data/traveler.sqlite3
      DATABASE_PATH: /app/data/tourism.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Choose the AI provider explicitly; OpenAI remains optional.
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Search is opt-in: enable only after reviewing provider quotas/terms.
      GEMINI_SEARCH_GROUNDING: ${GEMINI_SEARCH_GROUNDING:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      PARTNER_INQUIRIES_ENABLED: ${PARTNER_INQUIRIES_ENABLED:-false}
      CHAT_RATE_LIMIT_PER_MINUTE: '15'
    volumes:
      - masr_data:/app/data
    restart: unless-stopped
volumes:
  masr_data:
